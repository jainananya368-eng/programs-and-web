<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    <fieldset>
        <legend>Biodata</legend>
        <form action="./response.html">
            <label for="name">NAME:</label>
            <input type="text" name="name" id="name"
             placeholder="ENTER YOUR NAME" required>
             <br> <br>
             <label for="email">EMAIL:</label>
             <input type="email" name="email" id="email"
             placeholder="ENTER YOUR EMAIL" required>
              <br> <br>
              <label for="pw">PASSWORD:</label>
              <input type="password" name="pw" id="pw"
             placeholder="ENTER YOUR PASSWORD" required>
              <br> <br>
              <label for="gen">GENDER:</label>
              <input type="radio" name="gen" id="gen"
             placeholder="ENTER YOUR GENDER" required>
             <label for="MALE">male</label>
             <input type="radio" name="gen" id="gen"
             placeholder="ENTER YOUR GENDER" required>
             <label for="FEMALE">Female</label>
             <br> <br>
             <label for="HB">HOOBIES:</label>
             <br> <br>
             <label for="CRICKET">CRICKET:</label>
              <input type="checkbox" name="CRICKET" id="CRICKET">
              <br> <br>
              <label for="HOCKEY">HOCKEY:</label>
              <input type="checkbox" name="HOCKEY" id="HOCKEY">
    <br> <br>
              <select name="lang">
                <option>SELECT LANGUAGE</option>
                <option > C++</option>
                <option>C</option>
                <option>Python</option>
              </select>
              <br><br>
              <label for="DOB">DOB:</label>
              <input type="DATE" name="DOB" id="DOB">
              <br><br>
              <label for="HOME">HOMEPAGE:</label>
              <input type="URL" name="HOME" id="HOME">
              <br><br>
               <label for="NUM">ATTEMPTS:</label>
              <input type="number" name="NUM" id="NUM">
<br> <br>
              <input type="submit">
              <input type="reset">
        </form>
    </fieldset>
</body>
</html>
